<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1CB0F6">
<meta name="description" content="한국인 직장인을 위한 오픽(OPIc) 자격증 대비 트레이너">
<title>OPIc Coach — 오픽 자격증 대비</title>
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<!-- iOS: 홈 화면에 추가하면 주소창 없는 전체화면으로 뜬다 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OPIc Coach">
<link rel="apple-touch-icon" href="icons/icon-180.png">
</head>
<body>
  <div id="app" class="app">
    <header id="topbar" class="topbar" hidden></header>
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar" hidden></nav>
  </div>
  <div id="overlay" class="overlay" hidden></div>
  <script type="module" src="src/main.js"></script>
  <script>
    // 서비스워커는 https 또는 localhost 에서만 등록된다.
    if ('serviceWorker' in navigator) {
      // updateViaCache:'none' = sw.js 를 HTTP 캐시에서 꺼내쓰지 않고 항상 서버에 확인한다.
      addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
      });
      // 새 워커가 넘겨받으면 한 번만 새로고침해서 새 코드로 갈아탄다.
      let swReloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (swReloading) return;
        swReloading = true;
        location.reload();
      });
    }
  </script>
</body>
</html>
